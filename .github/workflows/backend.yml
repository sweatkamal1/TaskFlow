name: TaskFlow Backend CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  backend-ci:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TaskFlow_backend/package-lock.json

      - name: Install dependencies
        working-directory: TaskFlow_backend
        run: npm ci

      - name: Run tests
        working-directory: TaskFlow_backend
        run: npm test

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        working-directory: TaskFlow_backend
        run: docker build -t ghcr.io/${{ github.repository_owner }}/taskflow-backend:latest .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/taskflow-backend:latest