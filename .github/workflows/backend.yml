name: TaskFlow Backend CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  backend-ci:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TaskFlow_backend/package-lock.json

      - name: Install dependencies
        working-directory: TaskFlow_backend
        run: npm ci

      - name: Run tests
        working-directory: TaskFlow_backend
        run: npm test

      - name: Build Docker image
        working-directory: TaskFlow_backend
        run: docker build -t taskflow_backend .